# MailFlow — self-host (OSS). Single-tenant por defecto.
#
#   cp .env.example .env   # y rellena SECRET_KEY (ver README)
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# Servicios: postgres + redis + api (migra al arrancar) + worker (ARQ).
# El frontend (apps/web) se añadirá en la fase de UI.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailflow}
      POSTGRES_USER: ${POSTGRES_USER:-mailflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:-mailflow}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — see README}
      AUTH_MODE: ${AUTH_MODE:-single}
      SINGLE_TENANT_API_KEY: ${SINGLE_TENANT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:-mailflow}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — see README}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      # El navegador habla con el proxy BFF (/api/mf) del propio Next; el proxy
      # reenvía al API por la red interna usando esta URL (server-side).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      # Modo de auth web: "off" self-host (sin login), "on" SaaS (Better Auth).
      WEB_AUTH: ${WEB_AUTH:-off}
      # Solo en self-host con API key: el proxy la añade server-side.
      SINGLE_TENANT_API_KEY: ${SINGLE_TENANT_API_KEY:-}
      # Necesarios cuando WEB_AUTH=on (SaaS).
      DATABASE_URL: ${DATABASE_URL:-postgresql://mailflow:mailflow@postgres:5432/mailflow}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
